*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#111;font-family:system-ui,sans-serif}
#app{display:flex;flex-direction:row;height:100vh;min-height:520px}
#sidebar{
  width:210px;min-width:210px;
  display:flex;flex-direction:column;gap:0;
  background:#1a1a1a;
  border-right:1px solid #2a2a2a;
  overflow-y:auto;padding:14px 13px 20px;
  font-size:12px;
}
#sidebar::-webkit-scrollbar{width:4px}
#sidebar::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
.section{margin-bottom:16px}
.section-title{font-size:10px;font-weight:600;color:#555;text-transform:uppercase;letter-spacing:.07em;margin-bottom:9px}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px}
.row label{font-size:11px;color:#888;white-space:nowrap}
.row input[type=number]{
  width:62px;font-size:12px;padding:3px 6px;height:26px;
  background:#252525;border:1px solid #333;border-radius:4px;color:#ddd;text-align:right;
  outline:none;
}
.row input[type=number]:focus{border-color:#555}
.row input[type=color]{
  width:34px;height:26px;padding:2px;
  border:1px solid #333;border-radius:4px;cursor:pointer;background:#252525;
}
.row select{
  font-size:11px;padding:3px 5px;height:26px;flex:1;
  background:#252525;border:1px solid #333;border-radius:4px;color:#ddd;outline:none;
}
.row select:focus{border-color:#555}
.row input[type=range]{flex:1;height:26px;accent-color:#666}
.val{font-size:11px;color:#666;min-width:26px;text-align:right}
.row input[type=text]{
  flex:1;font-size:12px;padding:3px 6px;height:26px;
  background:#252525;border:1px solid #333;border-radius:4px;color:#ddd;outline:none;
}
.row input[type=text]:focus{border-color:#555}
.btn-rebuild{
  width:100%;font-size:11px;padding:6px;cursor:pointer;margin-top:2px;
  background:#252525;border:1px solid #333;border-radius:5px;color:#aaa;
  transition:all .15s;
}
.btn-rebuild:hover{background:#2e2e2e;color:#ddd;border-color:#444}

<body>

<div id="app">
<div id="sidebar">

  <div class="section">

  <div class="section">

  <!-- TEXT panel -->

      <div class="row"><label>Size</label><input type="number" id="fsize" value="150" min="20" max="320" step="5"></div>
      <div class="row"><label>Line H</label><input type="number" id="lineheight" value="1.1" min="0.8" max="2.5" step="0.05"></div>
      <div class="row"><label>Font</label>
        <select id="ffam">
          <option value="normal {s}px 'NeueHaas'">NeueHaas Roman</option>
          <option value="bold {s}px 'ManukaBold'">Manuka Bold</option>
          <option value="900 {s}px Impact" selected>Impact</option>
          <option value="900 {s}px Arial Black">Arial Black</option>
          <option value="bold {s}px Georgia">Georgia</option>
          <option value="bold {s}px Verdana">Verdana</option>
          <option value="bold {s}px 'Courier New'">Courier</option>
          <option value="custom" id="custom-font-opt" style="display:none">Custom font</option>
        </select>
      </div>
      <label class="font-upload-zone" for="fontInput">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M8 2v9M4 6l4-4 4 4" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 12v1a1 1 0 001 1h10a1 1 0 001-1v-1" stroke="#888" stroke-width="1.5" stroke-linecap="round"/></svg>
        Upload font (.ttf/.otf/.woff)

      <input type="file" id="fontInput" accept=".ttf,.otf,.woff,.woff2">
      <div id="font-label"></div>

  <!-- IMAGE panel -->
  <div id="panel-image" style="display:none">
    <div class="section">
      <div class="section-title">Image</div>

        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M10 3v10M6 7l4-4 4 4" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3 14v1a2 2 0 002 2h10a2 2 0 002-2v-1" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span id="upload-label">Upload image</span>
      </label>
      <input type="file" id="fileInput" accept="image/*">
      <img id="img-preview" alt="preview">
      <button id="clear-img" onclick="clearImage()">✕ Remove image</button>
      <div class="sep"></div>
      <div class="row"><label>Scale</label><input type="range" id="imgscale" min="20" max="200" value="90"><span class="val" id="isv">90%</span></div>
    </div>
  </div>

  <div class="sep"></div>

  <!-- GRID -->
  <div class="section">
    <div class="section-title">Grid</div>
    <div class="row"><label>Dot size</label><input type="number" id="dotsize" value="5" min="2" max="24" step="1"></div>
    <div class="row"><label>Row gap</label><input type="number" id="rowgap" value="0.01" min="0" max="4" step="0.01"></div>
    <div class="row"><label>Col gap</label><input type="number" id="colgap" value="0.5" min="0" max="6" step="0.1"></div>
    <div class="row"><label>Density</label><input type="number" id="density" value="1" min="1" max="5" step="1"></div>
    <div class="row"><label>Radius</label><input type="range" id="radius" min="0" max="50" value="8"><span class="val" id="rv">8%</span></div>

    <div class="section-title">Colours</div>
    <div class="row"><label>Background</label><input type="color" id="cbg" value="#63080b"></div>
    <div class="row"><label>Grid dots</label><input type="color" id="cgrid" value="#812326"></div>
    <div class="row"><label>Text / Image</label><input type="color" id="ctxt" value="#FF575D"></div>
  </div>

  <div class="section">
    <div class="section-title">Export</div>
    <button class="tab" id="btn-png" style="display:block;width:100%;margin-bottom:6px;height:28px;">Save PNG</button>
    <button class="tab" id="btn-rec" style="display:block;width:100%;height:28px;">● Record MP4</button>
  </div>

    <button class="btn-rebuild" id="rebuild">↺ Rebuild</button>
</div>

<div id="cw">
  <canvas id="main"></canvas>
  <div id="hint">nhấn giữ + kéo để tương tác</div>
</div>
</div>

<script>
(function(){
const canvas=document.getElementById('main');
const ctx=canvas.getContext('2d');
const hint=document.getElementById('hint');

let strands=[];
let animId;
let mx=-9999,my=-9999,pmx=-9999,pmy=-9999;
let pressed=false;
let windX=0,windY=0;
let currentMode='text';
let uploadedImage=null;
let customFontName=null;

// Fixed physics
const WIND_POW=1.0, RESTORE_K=0.001, DAMPING=0.999;
const AIR_DRAG=0.0018, DRAG_R=110, WIND_DECAY=0.62;
const ITERATIONS=18, GRAVITY=0.13;

function gv(id){return document.getElementById(id).value;}
function gn(id){return parseFloat(gv(id));}

function getP(){
  const dot=Math.max(2,gn('dotsize'));
  const rg=Math.max(0,gn('rowgap'));
  const cg=Math.max(0,gn('colgap'));
  let fontStr=gv('ffam');
  if(fontStr==='custom'&&customFontName){
    const s=parseInt(gn('fsize'))||150;
    fontStr=`bold ${s}px "${customFontName}"`;
  }
  return{
    dot,rg,cg,
    den:Math.max(1,parseInt(gn('density'))),
    rad:parseInt(gv('radius')),
    rowStep:dot*(1+rg),
    colStep:dot*(1+cg),
    fsize:parseInt(gn('fsize'))||150,
    lineH:parseFloat(gv('lineheight'))||1.1,
    fontStr,
    text:gv('txt')||'Wave',
    cbg:gv('cbg'),cgrid:gv('cgrid'),ctxt:gv('ctxt'),
    imgScale:parseInt(gv('imgscale'))||90,
  };
}

function resize(){
  const wrap=document.getElementById('cw');
  const cw=wrap.clientWidth;
  const ch=wrap.clientHeight||600;
  const layoutEl=document.getElementById('layout');
  const layout=layoutEl?layoutEl.value:'square';
  let W,H;
  if(layout==='square'){
    const s=Math.min(cw,ch);
    W=s;H=s;
  } else if(layout==='portrait'){
    // 4:5
    if(cw/ch<0.8){W=cw;H=cw/0.8;}
    else{H=ch;W=ch*0.8;}
  } else {
    // 16:9
    if(cw/ch>16/9){H=ch;W=ch*(16/9);}
    else{W=cw;H=cw*(9/16);}
  }
  canvas.width=Math.floor(W);
  canvas.height=Math.floor(H);
  canvas.style.width=Math.floor(W)+'px';
  canvas.style.height=Math.floor(H)+'px';
}

// ── word-wrap text into lines ─────────────────────────────────
function wrapText(oc, text, fontStr, maxWidth){
  oc.font=fontStr;
  const words=text.split(/\s+/).filter(Boolean);
  const lines=[];
  let current='';
  for(const w of words){
    const test=current?current+' '+w:w;
    if(oc.measureText(test).width<=maxWidth){
      current=test;
    } else {
      if(current) lines.push(current);
      // if single word is too wide, break by character
      if(oc.measureText(w).width>maxWidth){
        let sub='';
        for(const ch of w){
          if(oc.measureText(sub+ch).width>maxWidth){lines.push(sub);sub=ch;}
          else sub+=ch;
        }
        if(sub) current=sub;
        else current='';
      } else {
        current=w;
      }
    }
  }
  if(current) lines.push(current);
  return lines;
}

// ── Text mask with auto-wrap ──────────────────────────────────
function buildTextMask(p){
  const W=canvas.width,H=canvas.height;
  const gridW=W*0.80;
  const gridH=H*0.75;
  const fontStr=p.fontStr.replace('{s}',p.fsize);

  const off=document.createElement('canvas');
  off.width=W;off.height=H;
  const oc=off.getContext('2d');
  oc.clearRect(0,0,W,H);
  oc.font=fontStr;
  oc.textBaseline='top';
  oc.textAlign='center';
  oc.fillStyle='#fff';

  const lines=wrapText(oc,p.text,fontStr,gridW*0.96);
  const lineH=p.fsize*p.lineH;
  const totalH=lines.length*lineH;
  const startY=Math.max(0,(gridH-totalH)/2);
  const cx=W/2;

  for(let i=0;i<lines.length;i++){
    oc.fillText(lines[i],cx,startY+i*lineH);
  }

  const img=oc.getImageData(0,0,W,H);
  const px=img.data;
  return(x,y)=>{
    if(x<0||y<0||x>=W||y>=H) return false;
    return px[(Math.floor(y)*W+Math.floor(x))*4+3]>45;
  };
}

// ── Image mask ────────────────────────────────────────────────
function buildImageMask(p){
  const W=canvas.width,H=canvas.height;
  const gridW=W*0.80, gridH=H*0.75;
  const off=document.createElement('canvas');
  off.width=W;off.height=H;
  const oc=off.getContext('2d');
  oc.clearRect(0,0,W,H);
  const iw=uploadedImage.naturalWidth||uploadedImage.width;
  const ih=uploadedImage.naturalHeight||uploadedImage.height;
  const baseScale=Math.min(gridW/iw,gridH/ih);
  const scale=baseScale*(p.imgScale/100);
  const dw=iw*scale,dh=ih*scale;
  const dx=(W-dw)/2,dy=(gridH-dh)/2;
  oc.drawImage(uploadedImage,dx,dy,dw,dh);
  const img=oc.getImageData(0,0,W,H);
  const px=img.data;
  return(x,y)=>{
    if(x<0||y<0||x>=W||y>=H) return false;
    const i=(Math.floor(y)*W+Math.floor(x))*4;
    if(px[i+3]<60) return false;
    return(px[i]+px[i+1]+px[i+2])/3>60;
  };
}

function buildStrands(){
  const p=getP();
  const W=canvas.width,H=canvas.height;
  const gridW=W*0.80;
  const startX=(W-gridW)/2+p.colStep/2;
  const endX=(W+gridW)/2;
  const startY=p.rowStep/2;
  const endY=H*0.75;
  const inMask=(currentMode==='image'&&uploadedImage)?buildImageMask(p):buildTextMask(p);
  strands=[];
  for(let cx=startX;cx<endX;cx+=p.colStep*p.den){
    const nodes=[];
    for(let cy=startY;cy<endY;cy+=p.rowStep){
      nodes.push({x:cx,y:cy,px:cx,py:cy,inText:inMask(cx,cy),fixed:nodes.length===0});
    }
    if(nodes.length>=2) strands.push({cx,nodes});
  }
}

function step(){
  const p=getP();
  const REST=p.rowStep;
  for(const s of strands){
    const ns=s.nodes,N=ns.length,rcx=s.cx;
    for(let i=1;i<N;i++){
      const n=ns[i];
      const depth=i/(N-1),swing=depth*depth;
      let vx=(n.x-n.px)*DAMPING,vy=(n.y-n.py)*DAMPING;
      const spd2=vx*vx+vy*vy;
      if(spd2>0.0001){const spd=Math.sqrt(spd2),drag=AIR_DRAG*spd;vx-=vx*drag;vy-=vy*drag;}
      if(pressed){
        const dx=n.x-mx,dy=n.y-my,d2=dx*dx+dy*dy,r2=DRAG_R*DRAG_R;
        if(d2<r2){const fall=(1-d2/r2)*(1-d2/r2);vx+=windX*WIND_POW*fall*swing;vy+=windY*WIND_POW*fall*swing*0.3;}
      }
      const offsetX=n.x-rcx;
      vx-=offsetX*RESTORE_K*(1+Math.abs(offsetX)*0.002)*(1-swing*0.55);
      n.px=n.x;n.py=n.y;n.x+=vx;n.y+=vy+GRAVITY;
    }
    for(let it=0;it<ITERATIONS;it++){
      for(let i=0;i<N-1;i++){
        const a=ns[i],b=ns[i+1];
        const dx=b.x-a.x,dy=b.y-a.y;
        const d=Math.sqrt(dx*dx+dy*dy)||0.001;
        const diff=(d-REST)/d*0.5;
        const hx=dx*diff,hy=dy*diff;
        if(!a.fixed){a.x+=hx;a.y+=hy;}
        if(!b.fixed){b.x-=hx;b.y-=hy;}
      }
    }
  }
  windX*=WIND_DECAY;windY*=WIND_DECAY;
}

function render(){
  const p=getP();
  const ds=p.dot,half=ds/2,rr=ds*(p.rad/100)*0.5;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle=p.cbg;ctx.fillRect(0,0,canvas.width,canvas.height);
  for(const s of strands){
    const ns=s.nodes;
    if(ns.length<2) continue;
    ctx.beginPath();ctx.moveTo(ns[0].x,ns[0].y);
    for(let i=1;i<ns.length;i++) ctx.lineTo(ns[i].x,ns[i].y);
    ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=1;ctx.stroke();
    for(let i=0;i<ns.length-1;i++){
      if(ns[i].inText||ns[i+1].inText){
        ctx.beginPath();ctx.moveTo(ns[i].x,ns[i].y);ctx.lineTo(ns[i+1].x,ns[i+1].y);
        ctx.strokeStyle=p.ctxt+'44';ctx.lineWidth=1;ctx.stroke();
      }
    }
    for(let i=0;i<ns.length;i++){
      const n=ns[i];
      ctx.fillStyle=n.inText?p.ctxt:p.cgrid;
      ctx.beginPath();ctx.roundRect(n.x-half,n.y-half,ds,ds,rr);ctx.fill();
    }
  }
}

function loop(){step();render();animId=requestAnimationFrame(loop);}

function init(){
  if(animId) cancelAnimationFrame(animId);
  resize();buildStrands();windX=windY=0;loop();
}

window.setMode=function(m){
  currentMode=m;
  document.getElementById('panel-text').style.display=m==='text'?'':'none';
  document.getElementById('panel-image').style.display=m==='image'?'':'none';
  document.getElementById('tab-text').classList.toggle('active',m==='text');
  document.getElementById('tab-image').classList.toggle('active',m==='image');
  init();
};

// ── Font upload ────────────────────────────────────────────────
document.getElementById('fontInput').addEventListener('change',function(){
  const file=this.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    customFontName='CustomFont_'+Date.now();
    const ff=new FontFace(customFontName,e.target.result);
    ff.load().then(loaded=>{
      document.fonts.add(loaded);
      const opt=document.getElementById('custom-font-opt');
      opt.style.display='';
      opt.textContent=file.name.replace(/\.[^.]+$/,'');
      document.getElementById('ffam').value='custom';
      document.getElementById('font-label').textContent='✓ '+file.name;
      init();
    });
  };
  reader.readAsArrayBuffer(file);
});

// ── Image upload ───────────────────────────────────────────────
document.getElementById('fileInput').addEventListener('change',function(){
  const file=this.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      uploadedImage=img;
      const preview=document.getElementById('img-preview');
      preview.src=e.target.result;preview.style.display='block';
      document.getElementById('clear-img').style.display='block';
      document.getElementById('upload-label').textContent='Change image';
      init();
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
});

window.clearImage=function(){
  uploadedImage=null;
  document.getElementById('img-preview').style.display='none';
  document.getElementById('clear-img').style.display='none';
  document.getElementById('upload-label').textContent='Upload image';
  document.getElementById('fileInput').value='';
  init();
};

// ── Controls ───────────────────────────────────────────────────
document.getElementById('radius').addEventListener('input',function(){document.getElementById('rv').textContent=this.value+'%';});
document.getElementById('imgscale').addEventListener('input',function(){document.getElementById('isv').textContent=this.value+'%';init();});

['dotsize','rowgap','colgap','density','ffam','fsize','lineheight','cbg','cgrid','ctxt','radius','layout'].forEach(id=>{
  document.getElementById(id).addEventListener('change',init);
});
document.getElementById('radius').addEventListener('change',init);
document.getElementById('rebuild').addEventListener('click',init);
document.getElementById('txt').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();init();}});
document.getElementById('txt').addEventListener('input',()=>clearTimeout(window._tw)&&(window._tw=setTimeout(init,400)));
window.addEventListener('resize',init);

// ── Mouse/Touch ────────────────────────────────────────────────
function toC(cx,cy){
  const r=canvas.getBoundingClientRect();
  return{x:(cx-r.left)*(canvas.width/r.width),y:(cy-r.top)*(canvas.height/r.height)};
}
function onDown(cx,cy){pressed=true;const p=toC(cx,cy);pmx=mx=p.x;pmy=my=p.y;hint.style.opacity='0';}
function onMove(cx,cy){
  const p=toC(cx,cy);
  if(pressed&&pmx>-9000){windX=(p.x-pmx)*0.36;windY=(p.y-pmy)*0.18;}
  pmx=mx=p.x;pmy=my=p.y;
}
function onUp(){pressed=false;windX*=0.5;windY*=0.5;}

const cw=document.getElementById('cw');
cw.addEventListener('mousedown',e=>{e.preventDefault();onDown(e.clientX,e.clientY);});
cw.addEventListener('mousemove',e=>onMove(e.clientX,e.clientY));
window.addEventListener('mouseup',onUp);
cw.addEventListener('mouseleave',()=>{mx=my=pmx=pmy=-9999;});
cw.addEventListener('touchstart',e=>{e.preventDefault();onDown(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
cw.addEventListener('touchmove',e=>{e.preventDefault();onMove(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
cw.addEventListener('touchend',onUp);

init();

// ── EXPORT ──────────────────────────────────────────────────────
document.getElementById('btn-png').addEventListener('click',function(){
  const a=document.createElement('a');
  a.download='curtain.png';
  a.href=canvas.toDataURL('image/png');
  a.click();
});
let _rec=null,_recChunks=[];
document.getElementById('btn-rec').addEventListener('click',function(){
  if(_rec&&_rec.state==='recording'){_rec.stop();this.textContent='● Record MP4';return;}
  const stream=canvas.captureStream(30);
  _recChunks=[];
  const mime=MediaRecorder.isTypeSupported('video/mp4')?'video/mp4':'video/webm';
  _rec=new MediaRecorder(stream,{mimeType:mime});
  _rec.ondataavailable=e=>_recChunks.push(e.data);
  _rec.onstop=()=>{
    const blob=new Blob(_recChunks,{type:mime});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.download='curtain.'+(mime.includes('mp4')?'mp4':'webm');
    a.href=url;a.click();URL.revokeObjectURL(url);
  };
  _rec.start();this.textContent='■ Stop Recording';
});

})();
</script>
