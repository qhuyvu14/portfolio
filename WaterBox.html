*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#111;color:#eee;font-family:'Inter',sans-serif;font-size:13px;display:flex;height:100vh;overflow:hidden}
#sidebar{width:240px;min-width:240px;background:#1a1a1a;border-right:1px solid #2e2e2e;display:flex;flex-direction:column;overflow-y:auto;padding:14px 12px 20px}
#sidebar h1{font-size:13px;font-weight:500;color:#fff;letter-spacing:.02em;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid #2e2e2e}
.section{margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid #222}
.section:last-child{border-bottom:none;margin-bottom:0}
.section-title{font-size:10px;font-weight:500;color:#666;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
label{display:block;font-size:11px;color:#888;margin-bottom:3px;margin-top:8px}
label:first-of-type{margin-top:0}
textarea{width:100%;background:#222;border:1px solid #333;border-radius:5px;color:#eee;font-size:11px;font-family:inherit;padding:6px 8px;resize:none;height:70px;line-height:1.5;outline:none;transition:border-color .15s}
textarea:focus{border-color:#555}
select{width:100%;background:#222;border:1px solid #333;border-radius:5px;color:#eee;font-size:11px;font-family:inherit;padding:5px 8px;height:28px;outline:none;appearance:none;cursor:pointer}
.row{display:flex;align-items:center;gap:6px}
input[type=range]{flex:1;height:3px;accent-color:#fff;cursor:pointer}
.val{font-size:11px;color:#aaa;min-width:32px;text-align:right;font-variant-numeric:tabular-nums}
input[type=color]{width:28px;height:28px;border-radius:4px;border:1px solid #333;padding:2px;cursor:pointer;background:none;flex-shrink:0}
.color-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.color-row:last-child{margin-bottom:0}
.color-label{font-size:11px;color:#888;flex:1}
.seg{display:flex;background:#222;border-radius:5px;border:1px solid #333;overflow:hidden}
.seg button{flex:1;background:none;border:none;color:#888;font-size:11px;font-family:inherit;padding:5px 4px;cursor:pointer;transition:background .15s,color .15s;line-height:1}
.seg button.active{background:#3a3a3a;color:#fff}
.shape-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.shape-btn{aspect-ratio:1;background:#222;border:1px solid #333;border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s}
.shape-btn:hover{background:#2a2a2a}
.shape-btn.active{border-color:#fff;background:#2e2e2e}
.shape-btn svg{width:20px;height:20px}
.upload-btn{width:100%;background:#222;border:1px solid #333;border-radius:5px;color:#888;font-size:11px;font-family:inherit;padding:5px 8px;cursor:pointer;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upload-btn:hover{border-color:#555;color:#ccc}
#font-file{display:none}
#btn-reset{width:100%;background:#222;border:1px solid #333;border-radius:5px;color:#ccc;font-size:11px;font-family:inherit;padding:7px 8px;cursor:pointer;margin-top:4px}
#btn-reset:hover{background:#2a2a2a;border-color:#555}
#main{flex:1;display:flex;align-items:center;justify-content:center;background:#111;position:relative}
canvas{cursor:grab;touch-action:none;display:block}
canvas:active{cursor:grabbing}
#hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-size:11px;color:#444;pointer-events:none;white-space:nowrap}
@media(max-width:768px){body{flex-direction:column!important;}#sidebar{width:100%!important;min-width:unset!important;height:auto!important;max-height:45vh!important;border-right:none!important;border-bottom:1px solid #2e2e2e!important;overflow-y:auto!important;}html,body{overflow:auto!important;}#main{flex:1;min-height:0;}}
</style>

/* Force NeueHaas on all UI elements */
html, body, #sidebar, #sidebar-header, #sidebar-body, aside, header,
#sidebar *, #sidebar-header *, #sidebar-body *, aside *, header * {
  font-family: 'NeueHaas', 'Helvetica Neue', Arial, sans-serif \!important;
}
html, body { background: #ffffff \!important; color: #111111 \!important; }
/* Sidebar / aside backgrounds */
#sidebar, #app > #sidebar, aside {
  background: #ffffff \!important;
  border-right: 1px solid #e0e0e0 \!important;
}
#sidebar::-webkit-scrollbar-thumb { background: #dddddd \!important; }
/* Headers */
#sidebar h1, #sidebar-header h1, header h1 {
  color: #000000 \!important; font-size: 12px \!important; font-weight: 500 \!important;
}
#sidebar-header, header {
  background: #ffffff \!important; border-bottom: 1px solid #eeeeee \!important;
}
#sidebar-header p, header span { color: #aaaaaa \!important; font-weight: 400 \!important; }
/* Section separators */
.section { border-bottom-color: #eeeeee \!important; }
.section-title, .sec-title, .section-label, p.section-label {
  color: #999999 \!important; font-size: 10px \!important; letter-spacing: 0.07em \!important;
}
.sep, .separator { background: #eeeeee \!important; border-top-color: #eeeeee \!important; height: 1px \!important; }
/* Labels */
label { color: #666666 \!important; font-size: 11px \!important; }
.val, .field-val, .color-label { color: #555555 \!important; font-size: 11px \!important; }
/* Inputs */
textarea, select, input[type=text], input[type=number] {
  background: #f5f5f5 \!important; border: 1px solid #e0e0e0 \!important;
  border-radius: 0 \!important; color: #111111 \!important; font-size: 11px \!important;
}
textarea:focus, select:focus, input[type=text]:focus, input[type=number]:focus {
  border-color: #000000 \!important; outline: none \!important; box-shadow: none \!important;
}
input[type=range] { accent-color: #111111 \!important; }
input[type=color] { border: 1px solid #e0e0e0 \!important; border-radius: 0 \!important; }
/* Segment / tabs */
.seg, .mode-tabs { background: #f5f5f5 \!important; border: 1px solid #e0e0e0 \!important; border-radius: 0 \!important; }
.seg button, .tab { background: transparent \!important; color: #888888 \!important; border-radius: 0 \!important; font-size: 11px \!important; }
.seg button.active, .tab.active { background: #111111 \!important; color: #ffffff \!important; }
/* Shape buttons */
.shape-btn { background: #f5f5f5 \!important; border: 1px solid #e0e0e0 \!important; border-radius: 0 \!important; }
.shape-btn svg { stroke: #888888 \!important; }
.shape-btn:hover { background: #eeeeee \!important; }
.shape-btn.active { border-color: #000000 \!important; }
.shape-btn.active svg { stroke: #000000 \!important; }
/* Action buttons */
.upload-btn, #btn-reset, .font-upload-zone, .upload-zone, #font-upload-btn, #clear-img {
  background: #f5f5f5 \!important; border: 1px solid #e0e0e0 \!important;
  border-radius: 0 \!important; color: #888888 \!important; font-size: 11px \!important;
}
.upload-btn:hover, #btn-reset:hover, .font-upload-zone:hover, .upload-zone:hover,
#font-upload-btn:hover, #clear-img:hover {
  border-color: #000000 \!important; color: #000000 \!important; background: #eeeeee \!important;
}
.upload-zone { border-style: dashed \!important; }
.btn-group button {
  background: #f5f5f5 \!important; border: 1px solid #e0e0e0 \!important;
  border-radius: 0 \!important; color: #666666 \!important; font-size: 11px \!important;
}
.btn-group button:hover { border-color: #000000 \!important; color: #000000 \!important; background: #eeeeee \!important; }
.btn-group button.primary { background: #111111 \!important; color: #ffffff \!important; border-color: #111111 \!important; }
/* Color inputs */
.color-hex { background: #f5f5f5 \!important; border: 1px solid #e0e0e0 \!important; border-radius: 0 \!important; color: #111111 \!important; }
.color-swatch { border: 1px solid #e0e0e0 \!important; border-radius: 0 \!important; }
/* Hint */
#hint, .hint-text { color: #bbbbbb \!important; font-size: 10px \!important; }
/* Canvas / main containers */
#main { background: #f5f5f5 \!important; }
main { background: #f5f5f5 \!important; }
#canvas-area, #canvas-wrap { background: #f5f5f5 \!important; }
#upload-prompt { background: #f5f5f5 \!important; }
#upload-prompt-inner { color: #aaaaaa \!important; }
#img-list > div { background: #f5f5f5 \!important; border: 1px solid #e0e0e0 \!important; border-radius: 0 \!important; color: #666666 \!important; font-size: 11px \!important; }
/* Images To Text: override CSS vars */
:root {
  --bg: #ffffff; --surface: #f8f8f8; --surface2: #f0f0f0;
  --border: rgba(0,0,0,0.1); --border-hover: rgba(0,0,0,0.3);
  --text: #111111; --text-muted: #888888;
}

<body>

<div id="sidebar">
  <h1>Typography Water Box</h1>

  <div class="section">
    <div class="section-title">Text</div>
    <textarea id="T">Thousands of years ago, the first man discovered how to make fire.</textarea>
    <label>Font</label>
    <select id="F">
      <option value="BogartExtraLight">Bogartextralight (default)</option>
      <option value="Inter">Inter</option>
      <option value="serif">Serif</option>
      <option value="monospace">Monospace</option>
      <option value="Georgia">Georgia</option>
      <option value="Impact">Impact</option>
    </select>
    <label>Upload font (.ttf / .otf / .woff)</label>
    <input type="file" id="font-file" accept=".ttf,.otf,.woff,.woff2">
    <button class="upload-btn" id="font-upload-btn" onclick="document.getElementById('font-file').click()">Choose font file…</button>
    <label>Font size</label>
    <div class="row">
      <input type="range" id="FS" min="8" max="48" value="30">
      <span class="val" id="FSv">30</span>
    </div>
    <label>Type mode</label>
    <div class="seg" id="mode-seg">
      <button class="active" data-mode="letters">Letters</button>
      <button data-mode="blocks">Blocks</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Container</div>
    <label>Shape</label>
    <div class="shape-grid">
      <div class="shape-btn active" data-shape="square" title="Square">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="1"/></svg>
      </div>
      <div class="shape-btn" data-shape="circle" title="Circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/></svg>
      </div>
      <div class="shape-btn" data-shape="triangle" title="Triangle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="12,3 22,21 2,21"/></svg>
      </div>
    </div>
    <label>Box size</label>
    <div class="row">
      <input type="range" id="BOX-SIZE" min="160" max="500" value="380">
      <span class="val" id="BSv">380</span>
    </div>
    <label>Stroke width</label>
    <div class="row">
      <input type="range" id="SW" min="0" max="12" value="0" step="0.5">
      <span class="val" id="SWv">0</span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Colors</div>
    <div class="color-row"><span class="color-label">Background</span><input type="color" id="BG" value="#f90b0b"></div>
    <div class="color-row"><span class="color-label">Box fill</span><input type="color" id="FC" value="#000000"></div>
    <div class="color-row"><span class="color-label">Box stroke</span><input type="color" id="SC" value="#ffffff"></div>
    <div class="color-row"><span class="color-label">Text</span><input type="color" id="CC" value="#ffffff"></div>
  </div>

  <div class="section">
    <div class="section-title">Physics</div>
    <label>Gravity strength</label>
    <div class="row">
      <input type="range" id="GRAV" min="1" max="20" value="1">
      <span class="val" id="GRAVv">1</span>
    </div>
  </div>

  <div class="section">
    <button id="btn-reset">↺ Reset to default</button>
  </div>
</div>

<div id="main">
  <canvas id="C"></canvas>
  <div id="hint">drag to rotate the container</div>
</div>

<script>
(function(){
  const cv=document.getElementById('C');
  const ctx=cv.getContext('2d');
  const {Engine,Bodies,Body,Composite}=Matter;

  let engine,charBodies=[],charData=[],wallB=[];
  let boxAngle=0,angVel=0,prevAngVel=0,drag=null,built=false,woken=false;
  let currentShape='square',currentMode='letters',customFontName=null,canvasSize=460;

  const MAX_ANG_VEL=0.16;

  const DEFAULTS={
    text:'Thousands of years ago, the first man discovered how to make fire.',
    font:'BogartExtraLight',size:30,cc:'#ffffff',fc:'#000000',sc:'#ffffff',
    bg:'#f90b0b',sw:0,boxSize:380,grav:1
  };

  function cfg(){
    return{
      text:document.getElementById('T').value||'',
      font:customFontName||document.getElementById('F').value,
      size:+document.getElementById('FS').value,
      cc:document.getElementById('CC').value,
      fc:document.getElementById('FC').value,
      sc:document.getElementById('SC').value,
      bg:document.getElementById('BG').value,
      sw:+document.getElementById('SW').value,
      boxSize:+document.getElementById('BOX-SIZE').value,
      grav:+document.getElementById('GRAV').value,
    };
  }

  function resizeCanvas(){
    const main=document.getElementById('main');
    const s=Math.min(main.clientWidth-32,main.clientHeight-32,700);
    canvasSize=s; cv.width=s; cv.height=s;
  }

  // ── ENGINE ────────────────────────────────────────────────────
  function initEngine(){
    if(engine){Engine.clear(engine);charBodies=[];charData=[];wallB=[];}
    engine=Engine.create({gravity:{x:0,y:0,scale:0},positionIterations:12,velocityIterations:10});
    buildWalls();
  }

  function buildWalls(){
    const c=cfg(); const half=c.boxSize/2; const T=56;
    wallB.forEach(b=>Composite.remove(engine.world,b)); wallB=[];

    if(currentShape==='square'){
      // inner face exactly at ±half
      wallB=[
        Bodies.rectangle(0, half+T/2, (half+T)*2,T,{isStatic:true,restitution:0.03,friction:0.9,frictionStatic:1,label:'w'}),
        Bodies.rectangle(0,-half-T/2, (half+T)*2,T,{isStatic:true,restitution:0.03,friction:0.9,frictionStatic:1,label:'w'}),
        Bodies.rectangle(-half-T/2,0, T,(half+T)*2,{isStatic:true,restitution:0.03,friction:0.9,frictionStatic:1,label:'w'}),
        Bodies.rectangle( half+T/2,0, T,(half+T)*2,{isStatic:true,restitution:0.03,friction:0.9,frictionStatic:1,label:'w'}),
      ];

    } else if(currentShape==='circle'){
      // Wall segments: inner face at exactly R=half
      // center of each segment at R+T/2, facing inward
      const R=half; const segs=48;
      for(let i=0;i<segs;i++){
        const a0=i/segs*Math.PI*2, a1=(i+1)/segs*Math.PI*2, amid=(a0+a1)/2;
        const chord=2*(R+1)*Math.sin(Math.PI/segs); // slightly larger chord to avoid gaps
        const wcx=(R+T/2)*Math.cos(amid), wcy=(R+T/2)*Math.sin(amid);
        wallB.push(Bodies.rectangle(wcx,wcy,chord,T,{
          isStatic:true,restitution:0.03,friction:0.9,frictionStatic:1,label:'w',angle:amid+Math.PI/2
        }));
      }

    } else if(currentShape==='triangle'){
      // Equilateral triangle. Circumradius so inradius = half*0.9
      // inradius = circumR/2, so circumR = half*0.9*2 = half*1.8
      const circumR=half*1.72;
      const pts=[0,1,2].map(i=>{
        const a=-Math.PI/2+i*2*Math.PI/3;
        return{x:circumR*Math.cos(a),y:circumR*Math.sin(a)};
      });
      for(let i=0;i<3;i++){
        const a=pts[i],b=pts[(i+1)%3];
        const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
        const edgeLen=Math.hypot(b.x-a.x,b.y-a.y);
        const ang=Math.atan2(b.y-a.y,b.x-a.x);
        // Normal pointing outward from centroid (0,0)
        const nx=Math.cos(ang+Math.PI/2), ny=Math.sin(ang+Math.PI/2);
        const outward=(mx*nx+my*ny)>0?1:-1;
        wallB.push(Bodies.rectangle(
          mx+nx*T/2*outward, my+ny*T/2*outward,
          edgeLen+T, T,
          {isStatic:true,restitution:0.03,friction:0.9,frictionStatic:1,label:'w',angle:ang}
        ));
      }
    }
    wallB.forEach(b=>Composite.add(engine.world,b));
  }

  // ── MEASURE ───────────────────────────────────────────────────
  function measureGlyph(ch,font,size){
    ctx.font=`${size}px "${font}",Inter,sans-serif`;
    const m=ctx.measureText(ch);
    let w=m.width,h=size*0.78;
    if(m.actualBoundingBoxLeft!=null){
      const bw=m.actualBoundingBoxLeft+m.actualBoundingBoxRight;
      const bh=m.actualBoundingBoxAscent+m.actualBoundingBoxDescent;
      if(bw>2)w=bw; if(bh>2)h=bh;
    }
    return{adv:m.width,w:Math.max(w,5),h:Math.max(h,size*0.35)};
  }

  // Inner text layout region — conservative so chars start inside walls
  function getInnerBounds(boxSize){
    const half=boxSize/2;
    if(currentShape==='square') return{w:boxSize-10,h:boxSize-10,ox:0,oy:0};
    if(currentShape==='circle'){
      // inscribed square in circle: side = R*sqrt(2)*0.9 (conservative)
      const s=half*Math.SQRT2*0.86;
      return{w:s,h:s,ox:0,oy:0};
    }
    if(currentShape==='triangle'){
      // inradius = circumR/2 = half*1.72/2 = half*0.86
      const inR=half*0.82;
      // usable rect inside equilateral: width~inR*1.8, height~inR*1.3, shifted up slightly
      return{w:inR*1.7,h:inR*1.2,ox:0,oy:inR*0.2};
    }
    return{w:boxSize-10,h:boxSize-10,ox:0,oy:0};
  }

  // ── REBUILD ───────────────────────────────────────────────────
  function rebuild(){
    if(!engine)return;
    const c=cfg(); const fs=c.size;
    charBodies.forEach(b=>Composite.remove(engine.world,b));
    charBodies=[]; charData=[]; woken=false;
    ctx.font=`${fs}px "${c.font}",Inter,sans-serif`;

    const ib=getInnerBounds(c.boxSize);
    const startX=-ib.w/2+ib.ox, startY=-ib.h/2+ib.oy;
    const lineH=fs*1.08;

    function spawnBody(text,bx,by,gw,gh){
      const body=Bodies.rectangle(bx,by,Math.max(gw*0.84,3),Math.max(gh*0.84,3),{
        isStatic:true,restitution:0.02,friction:0.92,frictionAir:0.04,density:0.002,slop:0.3,label:'char'
      });
      Composite.add(engine.world,body);
      charBodies.push(body);
      charData.push({text,font:c.font,size:fs});
    }

    if(currentMode==='letters'){
      const words=c.text.split(/\s+/).filter(Boolean);
      let lines=[],cur='';
      for(const w of words){
        const test=cur?cur+' '+w:w;
        if(ctx.measureText(test).width>ib.w&&cur){lines.push(cur);cur=w;}
        else cur=test;
      }
      if(cur)lines.push(cur);
      lines.forEach((line,li)=>{
        const oy=startY+fs*0.88+li*lineH;
        if(oy+fs*0.5>startY+ib.h)return;
        let ox=startX;
        for(const ch of line){
          const g=measureGlyph(ch,c.font,fs);
          spawnBody(ch, ox+g.adv*0.5, oy, g.w, g.h);
          ox+=g.adv;
        }
      });
    } else {
      const words=c.text.split(/\s+/).filter(Boolean);
      let lines=[],cur=[];
      for(const w of words){
        const t=(cur.length?cur.join(' ')+' ':'')+w;
        if(ctx.measureText(t).width>ib.w&&cur.length){lines.push(cur);cur=[w];}
        else cur.push(w);
      }
      if(cur.length)lines.push(cur);
      const spW=ctx.measureText(' ').width;
      lines.forEach((arr,li)=>{
        const oy=startY+fs*0.88+li*lineH;
        if(oy+fs*0.5>startY+ib.h)return;
        let ox=startX;
        arr.forEach(word=>{
          const ww=ctx.measureText(word).width;
          const g=measureGlyph(word,c.font,fs);
          spawnBody(word, ox+ww*0.5, oy, ww, g.h);
          ox+=ww+spW;
        });
      });
    }
    built=true;
  }

  function wakeAll(){ if(woken)return; woken=true; charBodies.forEach(b=>Body.setStatic(b,false)); }

  // ── FORCES ────────────────────────────────────────────────────
  function applyForces(){
    if(!woken)return;
    const c=cfg();
    const G=0.00042*c.grav;
    const angAcc=angVel-prevAngVel;
    const gx=Math.sin(boxAngle)*G, gy=Math.cos(boxAngle)*G;

    charBodies.forEach(b=>{
      if(b.isStatic)return;
      const m=b.mass,{x,y}=b.position,{x:vx,y:vy}=b.velocity;
      let fx=gx*m, fy=gy*m;
      fx+=m*angAcc*y*0.0008;   fy+=m*angAcc*(-x)*0.0008;
      fx+=m*angVel*angVel*x*0.00008; fy+=m*angVel*angVel*y*0.00008;
      fx+=2*m*angVel*vy*0.00012; fy+=2*m*angVel*(-vx)*0.00012;
      Body.applyForce(b,b.position,{x:fx,y:fy});
    });
  }

  // Safety clamp — teleport escaped bodies back inside
  function clampBodies(){
    const c=cfg(); const half=c.boxSize/2;
    charBodies.forEach(b=>{
      if(b.isStatic)return;
      const {x,y}=b.position; let nx=x,ny=y,hit=false;

      if(currentShape==='square'){
        const lim=half-1;
        if(x<-lim){nx=-lim;hit=true;} if(x>lim){nx=lim;hit=true;}
        if(y<-lim){ny=-lim;hit=true;} if(y>lim){ny=lim;hit=true;}
      } else {
        // circle and triangle: use circumscribed circle as outer bound
        const R=(currentShape==='circle')?half-1:half*0.86*2-1;
        const d=Math.hypot(x,y);
        if(d>R){const s=R/d;nx=x*s;ny=y*s;hit=true;}
      }

      if(hit){
        Body.setPosition(b,{x:nx,y:ny});
        Body.setVelocity(b,{x:b.velocity.x*0.1,y:b.velocity.y*0.1});
      }
    });
  }

  // ── DRAW ──────────────────────────────────────────────────────
  function drawPath(half){
    ctx.beginPath();
    if(currentShape==='square'){
      ctx.rect(-half,-half,half*2,half*2);
    } else if(currentShape==='circle'){
      ctx.arc(0,0,half,0,Math.PI*2);
    } else if(currentShape==='triangle'){
      const R=half*1.72;
      for(let i=0;i<3;i++){
        const a=-Math.PI/2+i*2*Math.PI/3;
        const px=R*Math.cos(a),py=R*Math.sin(a);
        i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
      }
      ctx.closePath();
    }
  }

  function draw(){
    const c=cfg(); const S=canvasSize; const half=c.boxSize/2;
    ctx.clearRect(0,0,S,S);
    ctx.fillStyle=c.bg; ctx.fillRect(0,0,S,S);

    ctx.save();
    ctx.translate(S/2,S/2);
    ctx.rotate(boxAngle);

    // fill
    drawPath(half); ctx.fillStyle=c.fc; ctx.fill();

    // clip + draw chars
    ctx.save();
    drawPath(half); ctx.clip();
    ctx.textAlign='center'; ctx.textBaseline='middle';
    charBodies.forEach((b,i)=>{
      const d=charData[i];
      ctx.save();
      ctx.translate(b.position.x,b.position.y);
      if(Math.abs(b.angle)>0.001)ctx.rotate(b.angle);
      ctx.font=`${d.size}px "${d.font}",Inter,sans-serif`;
      ctx.fillStyle=c.cc;
      ctx.fillText(d.text,0,0);
      ctx.restore();
    });
    ctx.restore();

    // stroke
    if(c.sw>0){ drawPath(half); ctx.strokeStyle=c.sc; ctx.lineWidth=c.sw; ctx.stroke(); }

    ctx.restore();
  }

  // ── LOOP ──────────────────────────────────────────────────────
  let lastT=0;
  function loop(ts){
    const dt=Math.min(ts-lastT,32); lastT=ts;
    if(!drag){ angVel*=0.94; boxAngle+=angVel; if(Math.abs(angVel)<0.00003)angVel=0; }
    applyForces();
    Engine.update(engine,16);
    clampBodies();
    prevAngVel=angVel;
    draw();
    requestAnimationFrame(loop);
  }

  // ── DRAG with speed cap ───────────────────────────────────────
  function getA(e){
    const r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;
    return Math.atan2(t.clientY-(r.top+r.height/2),t.clientX-(r.left+r.width/2));
  }
  function applyDrag(e){
    const a=getA(e),now=performance.now(),dt=Math.max(now-drag.pt,1);
    let v=(a-drag.pa)/(dt*0.016);
    angVel=Math.max(-MAX_ANG_VEL,Math.min(MAX_ANG_VEL,v));
    boxAngle=a-drag.s; drag.pa=a; drag.pt=now;
    wakeAll();
  }
  cv.addEventListener('mousedown',e=>{const a=getA(e);drag={s:a-boxAngle,pa:a,pt:performance.now()};e.preventDefault();});
  window.addEventListener('mousemove',e=>{if(!drag)return;applyDrag(e);});
  window.addEventListener('mouseup',()=>{drag=null;});
  cv.addEventListener('touchstart',e=>{const a=getA(e);drag={s:a-boxAngle,pa:a,pt:performance.now()};e.preventDefault();},{passive:false});
  cv.addEventListener('touchmove',e=>{if(!drag)return;applyDrag(e);e.preventDefault();},{passive:false});
  cv.addEventListener('touchend',()=>{drag=null;});

  // ── RESET ─────────────────────────────────────────────────────
  function resetAll(){
    boxAngle=0;angVel=0;prevAngVel=0;woken=false;
    const D=DEFAULTS;
    document.getElementById('T').value=D.text;
    document.getElementById('F').value=D.font;
    document.getElementById('FS').value=D.size; document.getElementById('FSv').textContent=D.size;
    document.getElementById('CC').value=D.cc;
    document.getElementById('FC').value=D.fc;
    document.getElementById('SC').value=D.sc;
    document.getElementById('BG').value=D.bg;
    document.getElementById('SW').value=D.sw; document.getElementById('SWv').textContent=D.sw;
    document.getElementById('BOX-SIZE').value=D.boxSize; document.getElementById('BSv').textContent=D.boxSize;
    document.getElementById('GRAV').value=D.grav; document.getElementById('GRAVv').textContent=D.grav;
    document.getElementById('font-upload-btn').textContent='Choose font file…';
    customFontName=null;
    currentShape='square';
    document.querySelectorAll('.shape-btn').forEach(b=>b.classList.toggle('active',b.dataset.shape==='square'));
    currentMode='letters';
    document.querySelectorAll('#mode-seg button').forEach(b=>b.classList.toggle('active',b.dataset.mode==='letters'));
    initEngine(); rebuild();
  }

  // ── CONTROLS ──────────────────────────────────────────────────
  function onRebuild(){if(built){initEngine();rebuild();}}
  document.getElementById('T').addEventListener('input',()=>setTimeout(onRebuild,10));
  document.getElementById('F').addEventListener('change',()=>{customFontName=null;setTimeout(onRebuild,10);});
  document.getElementById('FS').addEventListener('input',e=>{document.getElementById('FSv').textContent=e.target.value;setTimeout(onRebuild,10);});
  document.getElementById('SW').addEventListener('input',e=>document.getElementById('SWv').textContent=(+e.target.value).toFixed(1));
  document.getElementById('BOX-SIZE').addEventListener('input',e=>{document.getElementById('BSv').textContent=e.target.value;setTimeout(onRebuild,10);});
  document.getElementById('GRAV').addEventListener('input',e=>document.getElementById('GRAVv').textContent=e.target.value);
  document.querySelectorAll('.shape-btn').forEach(btn=>btn.addEventListener('click',()=>{
    currentShape=btn.dataset.shape;
    document.querySelectorAll('.shape-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); setTimeout(onRebuild,10);
  }));
  document.querySelectorAll('#mode-seg button').forEach(btn=>btn.addEventListener('click',()=>{
    currentMode=btn.dataset.mode;
    document.querySelectorAll('#mode-seg button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); setTimeout(onRebuild,10);
  }));
  document.getElementById('font-file').addEventListener('change',e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      const name='CF_'+Date.now();
      new FontFace(name,ev.target.result).load().then(f=>{
        document.fonts.add(f);customFontName=name;
        document.getElementById('font-upload-btn').textContent=file.name;
        setTimeout(onRebuild,100);
      });
    };
    reader.readAsArrayBuffer(file);
  });
  document.getElementById('btn-reset').addEventListener('click',resetAll);

  window.addEventListener('resize',resizeCanvas);
  resizeCanvas();
  // set default font select
  document.getElementById('F').value='BogartExtraLight';
    document.fonts.ready.then(()=>{initEngine();rebuild();requestAnimationFrame(loop);});
  setTimeout(()=>{if(!built){initEngine();rebuild();requestAnimationFrame(loop);}},1200);
})();
</script>
</body>
</html>
