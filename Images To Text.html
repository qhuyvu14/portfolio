<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typography Grid Tool</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --surface2: #222222;
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.22);
    --text: #f0f0f0;
    --text-muted: #666666;
    --radius: 6px;
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  header {
    padding: 16px 24px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-shrink: 0;
  }
  header h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text);
  }
  header span {
    font-size: 12px;
    color: var(--text-muted);
    font-family: 'IBM Plex Mono', monospace;
  }

  /* ── LAYOUT ── */
  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
    min-height: 0;
  }

  /* ── SIDEBAR ── */
  aside {
    width: 216px;
    min-width: 216px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    overflow-y: auto;
    flex-shrink: 0;
  }

  .section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  /* upload zone */
  .upload-zone {
    border: 1px dashed var(--border-hover);
    border-radius: var(--radius);
    padding: 14px 12px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
    display: block;
  }
  .upload-zone:hover {
    border-color: rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.03);
  }
  .upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .upload-zone .icon {
    font-size: 18px;
    display: block;
    margin-bottom: 5px;
    color: var(--text-muted);
  }
  .upload-zone p { font-size: 12px; color: var(--text-muted); line-height: 1.4; }
  .upload-zone .img-name {
    margin-top: 7px;
    font-size: 11px;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* image thumbnails */
  #img-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-top: 8px;
  }
  .img-thumb {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 7px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--surface2);
  }
  .img-thumb img {
    width: 28px;
    height: 20px;
    object-fit: cover;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .img-thumb .thumb-name {
    font-size: 11px;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text-muted);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .img-thumb .thumb-remove {
    font-size: 11px;
    color: var(--text-muted);
    cursor: pointer;
    flex-shrink: 0;
    padding: 2px 4px;
    border-radius: 3px;
    transition: color 0.15s, background 0.15s;
    line-height: 1;
    background: none;
    border: none;
    font-family: inherit;
  }
  .img-thumb .thumb-remove:hover { color: var(--text); background: rgba(255,255,255,0.08); border: none; }

  /* controls */
  .control { display: flex; flex-direction: column; gap: 8px; }
  .control-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .control-row label { font-size: 12px; color: var(--text-muted); }
  .control-row .val {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text);
    min-width: 28px;
    text-align: right;
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 1px;
    background: rgba(255,255,255,0.2);
    border-radius: 1px;
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #f0f0f0;
    cursor: pointer;
    transition: transform 0.15s;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }

  /* color pickers */
  .color-control {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .color-control label { font-size: 12px; color: var(--text-muted); flex: 1; }
  .color-swatch {
    position: relative;
    width: 30px;
    height: 20px;
    border-radius: 3px;
    border: 1px solid var(--border-hover);
    overflow: hidden;
    cursor: pointer;
    flex-shrink: 0;
  }
  .color-swatch input[type=color] {
    position: absolute;
    inset: -4px;
    width: calc(100% + 8px);
    height: calc(100% + 8px);
    border: none;
    padding: 0;
    cursor: pointer;
    opacity: 0;
  }
  .color-swatch .preview {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .color-hex {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    width: 58px;
    text-align: right;
  }

  /* buttons */
  .btn-group { display: flex; flex-direction: column; gap: 6px; }
  button {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px;
    padding: 8px 12px;
    border-radius: var(--radius);
    border: 1px solid var(--border-hover);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: 0.01em;
  }
  button:hover { background: var(--surface2); border-color: rgba(255,255,255,0.35); }
  button.primary {
    background: #f0f0f0;
    color: #0e0e0e;
    border-color: transparent;
    font-weight: 500;
  }
  button.primary:hover { background: #ffffff; }

  .hint-text {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.8;
    font-family: 'IBM Plex Mono', monospace;
  }

  /* ── CANVAS AREA ── */
  main {
    flex: 1;
    overflow: hidden;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 0;
  }

  #canvas-wrap {
    position: relative;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.1), 0 8px 40px rgba(0,0,0,0.6);
    border-radius: 2px;
    overflow: hidden;
    cursor: crosshair;
    flex-shrink: 0;
    max-width: 100%;
    max-height: 100%;
  }
  #canvas-wrap canvas {
    display: block;
    touch-action: none;
    max-width: 100%;
    max-height: 100%;
  }
  #upload-prompt {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  #upload-prompt-inner {
    text-align: center;
  }
  #upload-prompt-inner span {
    display: block;
    font-size: 28px;
    color: rgba(255,255,255,0.15);
    margin-bottom: 10px;
  }
  #upload-prompt-inner p {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.2);
  }
@media(max-width:768px){.layout{flex-direction:column!important;overflow:visible!important;}aside{width:100%!important;min-width:unset!important;height:auto!important;max-height:45vh!important;border-right:none!important;border-bottom:1px solid var(--border)!important;overflow-y:auto!important;}main{min-height:55vh!important;overflow:auto!important;}html,body{overflow:auto!important;height:auto!important;}}
</style>

/* Force NeueHaas on all UI elements */
html, body, #sidebar, #sidebar-header, #sidebar-body, aside, header,
#sidebar *, #sidebar-header *, #sidebar-body *, aside *, header * {
  font-family: 'NeueHaas', 'Helvetica Neue', Arial, sans-serif \!important;
}
html, body { background: #ffffff \!important; color: #111111 \!important; }
/* Sidebar / aside backgrounds */
#sidebar, #app > #sidebar, aside {
  background: #ffffff \!important;
  border-right: 1px solid #e0e0e0 \!important;
}
#sidebar::-webkit-scrollbar-thumb { background: #dddddd \!important; }
/* Headers */
#sidebar h1, #sidebar-header h1, header h1 {
  color: #000000 \!important; font-size: 12px \!important; font-weight: 500 \!important;
}
#sidebar-header, header {
  background: #ffffff \!important; border-bottom: 1px solid #eeeeee \!important;
}
#sidebar-header p, header span { color: #aaaaaa \!important; font-weight: 400 \!important; }
/* Section separators */
.section { border-bottom-color: #eeeeee \!important; }
.section-title, .sec-title, .section-label, p.section-label {
  color: #999999 \!important; font-size: 10px \!important; letter-spacing: 0.07em \!important;
}
.sep, .separator { background: #eeeeee \!important; border-top-color: #eeeeee \!important; height: 1px \!important; }
/* Labels */
label { color: #666666 \!important; font-size: 11px \!important; }
.val, .field-val, .color-label { color: #555555 \!important; font-size: 11px \!important; }
/* Inputs */
textarea, select, input[type=text], input[type=number] {
  background: #f5f5f5 \!important; border: 1px solid #e0e0e0 \!important;
  border-radius: 0 \!important; color: #111111 \!important; font-size: 11px \!important;
}
textarea:focus, select:focus, input[type=text]:focus, input[type=number]:focus {
  border-color: #000000 \!important; outline: none \!important; box-shadow: none \!important;
}
input[type=range] { accent-color: #111111 \!important; }
input[type=color] { border: 1px solid #e0e0e0 \!important; border-radius: 0 \!important; }
/* Segment / tabs */
.seg, .mode-tabs { background: #f5f5f5 \!important; border: 1px solid #e0e0e0 \!important; border-radius: 0 \!important; }
.seg button, .tab { background: transparent \!important; color: #888888 \!important; border-radius: 0 \!important; font-size: 11px \!important; }
.seg button.active, .tab.active { background: #111111 \!important; color: #ffffff \!important; }
/* Shape buttons */
.shape-btn { background: #f5f5f5 \!important; border: 1px solid #e0e0e0 \!important; border-radius: 0 \!important; }
.shape-btn svg { stroke: #888888 \!important; }
.shape-btn:hover { background: #eeeeee \!important; }
.shape-btn.active { border-color: #000000 \!important; }
.shape-btn.active svg { stroke: #000000 \!important; }
/* Action buttons */
.upload-btn, #btn-reset, .font-upload-zone, .upload-zone, #font-upload-btn, #clear-img {
  background: #f5f5f5 \!important; border: 1px solid #e0e0e0 \!important;
  border-radius: 0 \!important; color: #888888 \!important; font-size: 11px \!important;
}
.upload-btn:hover, #btn-reset:hover, .font-upload-zone:hover, .upload-zone:hover,
#font-upload-btn:hover, #clear-img:hover {
  border-color: #000000 \!important; color: #000000 \!important; background: #eeeeee \!important;
}
.upload-zone { border-style: dashed \!important; }
.btn-group button {
  background: #f5f5f5 \!important; border: 1px solid #e0e0e0 \!important;
  border-radius: 0 \!important; color: #666666 \!important; font-size: 11px \!important;
}
.btn-group button:hover { border-color: #000000 \!important; color: #000000 \!important; background: #eeeeee \!important; }
.btn-group button.primary { background: #111111 \!important; color: #ffffff \!important; border-color: #111111 \!important; }
/* Color inputs */
.color-hex { background: #f5f5f5 \!important; border: 1px solid #e0e0e0 \!important; border-radius: 0 \!important; color: #111111 \!important; }
.color-swatch { border: 1px solid #e0e0e0 \!important; border-radius: 0 \!important; }
/* Hint */
#hint, .hint-text { color: #bbbbbb \!important; font-size: 10px \!important; }
/* Canvas / main containers */
#main { background: #f5f5f5 \!important; }
main { background: #f5f5f5 \!important; }
#canvas-area, #canvas-wrap { background: #f5f5f5 \!important; }
#upload-prompt { background: #f5f5f5 \!important; }
#upload-prompt-inner { color: #aaaaaa \!important; }
#img-list > div { background: #f5f5f5 \!important; border: 1px solid #e0e0e0 \!important; border-radius: 0 \!important; color: #666666 \!important; font-size: 11px \!important; }
/* Images To Text: override CSS vars */
:root {
  --bg: #ffffff; --surface: #f8f8f8; --surface2: #f0f0f0;
  --border: rgba(0,0,0,0.1); --border-hover: rgba(0,0,0,0.3);
  --text: #111111; --text-muted: #888888;
}
</style>
</head>
<body>

<header>
  <h1>Typography Grid</h1>
  <span>click &amp; drag to paint</span>
</header>

<div class="layout">
  <aside>

    <!-- IMAGE -->
    <div>
      <p class="section-label">Tile images</p>
      <label class="upload-zone">
        <input type="file" id="file-input" accept="image/*" multiple>
        <span class="icon">↑</span>
        <p>Upload images</p>
        <p style="font-size:10px;margin-top:4px;font-family:'IBM Plex Mono',monospace;">multiple supported</p>
      </label>
      <div id="img-list"></div>
    </div>

    <!-- GRID -->
    <div>
      <p class="section-label">Grid</p>
      <div class="control">
        <div class="control-row">
          <label>Columns</label>
          <span class="val" id="cols-val">46</span>
        </div>
        <input type="range" id="cols-slider" min="4" max="100" value="46" step="1">
      </div>
      <div class="control" style="margin-top:12px;">
        <div class="control-row">
          <label>Gap</label>
          <span class="val" id="gap-val">0</span>
        </div>
        <input type="range" id="gap-slider" min="-100" max="100" value="0" step="1">
        <div style="display:flex;justify-content:space-between;margin-top:3px;">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-muted);">overlap</span>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-muted);">spread</span>
        </div>
      </div>
    </div>

    <!-- STROKE -->
    <div>
      <p class="section-label">Stroke</p>
      <div class="control">
        <div class="control-row">
          <label>Weight</label>
          <span class="val" id="stroke-val">0.5</span>
        </div>
        <input type="range" id="stroke-slider" min="0" max="3" value="0.5" step="0.1">
      </div>
    </div>

    <!-- COLOURS -->
    <div>
      <p class="section-label">Colors</p>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <div class="color-control">
          <label>Background</label>
          <div class="color-swatch" id="bg-swatch">
            <div class="preview" id="bg-preview" style="background:#f2f3eb;"></div>
            <input type="color" id="bg-color" value="#f2f3eb">
          </div>
          <span class="color-hex" id="bg-hex">#f2f3eb</span>
        </div>
        <div class="color-control">
          <label>Stroke</label>
          <div class="color-swatch" id="stroke-swatch">
            <div class="preview" id="stroke-preview" style="background:#1e1e1e;"></div>
            <input type="color" id="stroke-color" value="#1e1e1e">
          </div>
          <span class="color-hex" id="stroke-hex">#1e1e1e</span>
        </div>
      </div>
    </div>

    <!-- ACTIONS -->
    <div>
      <p class="section-label">Actions</p>
      <div class="btn-group">
        <button id="clear-btn">✕ &nbsp;Clear canvas</button>
        <button class="primary" id="save-btn">↓ &nbsp;Save PNG</button>
      </div>
    </div>

    <!-- HINT -->
    <div style="margin-top:auto;">
      <p class="hint-text">
        Click → toggle cell<br>
        Drag → paint<br>
        Alt+drag → erase
      </p>
    </div>

  </aside>

  <main>
    <div id="canvas-wrap">
      <canvas id="c"></canvas>
      <div id="upload-prompt">
        <div id="upload-prompt-inner">
          <span>↑</span>
          <p>Upload an image to begin</p>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
const canvasEl = document.getElementById('c');
const ctx = canvasEl.getContext('2d');
const colsSlider = document.getElementById('cols-slider');
const colsVal = document.getElementById('cols-val');
const gapSlider = document.getElementById('gap-slider');
const gapVal = document.getElementById('gap-val');
const strokeSlider = document.getElementById('stroke-slider');
const strokeVal = document.getElementById('stroke-val');
const fileInput = document.getElementById('file-input');
const imgList = document.getElementById('img-list');
const clearBtn = document.getElementById('clear-btn');
const saveBtn = document.getElementById('save-btn');
const bgColorInput = document.getElementById('bg-color');
const strokeColorInput = document.getElementById('stroke-color');
const bgPreview = document.getElementById('bg-preview');
const strokePreview = document.getElementById('stroke-preview');
const bgHex = document.getElementById('bg-hex');
const strokeHex = document.getElementById('stroke-hex');

// images array — each entry is a loaded HTMLImageElement
let images = [];
let cols = 46;
let rows = 0;
let cellW = 0, cellH = 0;
// grid stores: null = empty, number = index into images[]
let grid = [];
let isDragging = false;
let eraseMode = false;
let canvasW = 0, canvasH = 0;
let bgColor = '#f2f3eb';
let strokeColor = '#1e1e1e';
let strokeWeight = 0.5;
let gap = 0;

function pickRandom() {
  return Math.floor(Math.random() * images.length);
}

function initGrid() {
  const mainEl = document.querySelector('main');
  const availW = mainEl.clientWidth - 40;
  const availH = mainEl.clientHeight - 40;
  canvasW = Math.max(availW, 100);
  const maxH = Math.max(availH, 100);

  if (images.length > 0) {
    const ref = images[0];
    const ratio = ref.naturalHeight / ref.naturalWidth;
    cellW = canvasW / cols;
    cellH = cellW * ratio;
  } else {
    cellW = canvasW / cols;
    cellH = cellW;
  }

  rows = Math.max(Math.floor(maxH / cellH), 2);
  canvasH = rows * cellH;
  canvasEl.width = Math.round(canvasW);
  canvasEl.height = Math.round(canvasH);
  grid = Array.from({ length: rows }, () => new Array(cols).fill(null));
}

function render() {
  ctx.clearRect(0, 0, canvasW, canvasH);
  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, canvasW, canvasH);

  if (images.length === 0) {
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const px = x * cellW, py = y * cellH;
        ctx.strokeStyle = 'rgba(150,150,150,0.25)';
        ctx.lineWidth = 0.5;
        ctx.strokeRect(px + 0.25, py + 0.25, cellW - 0.5, cellH - 0.5);
      }
    }
    return;
  }

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const px = x * cellW, py = y * cellH;
      const gx = px + gap / 2, gy = py + gap / 2;
      const gw = cellW - gap, gh = cellH - gap;
      const idx = grid[y] != null ? grid[y][x] : null;
      if (idx !== null && images[idx]) {
        ctx.drawImage(images[idx], gx, gy, gw, gh);
      }
      if (strokeWeight > 0) {
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = strokeWeight;
        ctx.strokeRect(px + strokeWeight / 2, py + strokeWeight / 2, cellW - strokeWeight, cellH - strokeWeight);
      }
    }
  }
}

function getCell(e) {
  const rect = canvasEl.getBoundingClientRect();
  const scaleX = canvasW / rect.width;
  const scaleY = canvasH / rect.height;
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: Math.floor((cx - rect.left) * scaleX / cellW),
    y: Math.floor((cy - rect.top) * scaleY / cellH)
  };
}

canvasEl.addEventListener('mousedown', (e) => {
  isDragging = true;
  eraseMode = e.altKey;
  const { x, y } = getCell(e);
  if (x >= 0 && x < cols && y >= 0 && y < rows) {
    if (eraseMode) { grid[y][x] = null; }
    else { grid[y][x] = grid[y][x] !== null ? null : pickRandom(); }
    render();
  }
});
canvasEl.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const { x, y } = getCell(e);
  if (x >= 0 && x < cols && y >= 0 && y < rows) {
    grid[y][x] = eraseMode ? null : pickRandom();
    render();
  }
});
canvasEl.addEventListener('mouseup', () => isDragging = false);
canvasEl.addEventListener('mouseleave', () => isDragging = false);

canvasEl.addEventListener('touchstart', (e) => {
  e.preventDefault(); isDragging = true; eraseMode = false;
  const { x, y } = getCell(e);
  if (x >= 0 && x < cols && y >= 0 && y < rows) {
    grid[y][x] = grid[y][x] !== null ? null : pickRandom();
    render();
  }
}, { passive: false });
canvasEl.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (!isDragging) return;
  const { x, y } = getCell(e);
  if (x >= 0 && x < cols && y >= 0 && y < rows) { grid[y][x] = pickRandom(); render(); }
}, { passive: false });
canvasEl.addEventListener('touchend', () => isDragging = false);

colsSlider.addEventListener('input', () => {
  cols = parseInt(colsSlider.value);
  colsVal.textContent = cols;
  const saved = grid.map(r => [...r]);
  initGrid();
  for (let y = 0; y < Math.min(rows, saved.length); y++)
    for (let x = 0; x < Math.min(cols, saved[y].length); x++)
      grid[y][x] = saved[y][x];
  render();
});

strokeSlider.addEventListener('input', () => {
  strokeWeight = parseFloat(strokeSlider.value);
  strokeVal.textContent = strokeWeight.toFixed(1);
  render();
});

gapSlider.addEventListener('input', () => {
  gap = parseFloat(gapSlider.value);
  gapVal.textContent = gap;
  render();
});

bgColorInput.addEventListener('input', () => {
  bgColor = bgColorInput.value;
  bgPreview.style.background = bgColor;
  bgHex.textContent = bgColor;
  render();
});
strokeColorInput.addEventListener('input', () => {
  strokeColor = strokeColorInput.value;
  strokePreview.style.background = strokeColor;
  strokeHex.textContent = strokeColor;
  render();
});

document.getElementById('bg-swatch').addEventListener('click', () => bgColorInput.click());
document.getElementById('stroke-swatch').addEventListener('click', () => strokeColorInput.click());

clearBtn.addEventListener('click', () => {
  grid = Array.from({ length: rows }, () => new Array(cols).fill(null));
  render();
});

saveBtn.addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'typography-grid.png';
  link.href = canvasEl.toDataURL('image/png');
  link.click();
});

function removeImage(idx) {
  // remap grid: cells pointing to removed index → null, others shift down
  images.splice(idx, 1);
  for (let y = 0; y < rows; y++)
    for (let x = 0; x < cols; x++) {
      const v = grid[y][x];
      if (v === idx) grid[y][x] = null;
      else if (v > idx) grid[y][x] = v - 1;
    }
  renderThumbs();
  if (images.length === 0) {
    document.getElementById('upload-prompt').style.display = 'flex';
    initGrid();
  }
  render();
}

function renderThumbs() {
  imgList.innerHTML = '';
  images.forEach((imgEl, i) => {
    const row = document.createElement('div');
    row.className = 'img-thumb';
    const thumb = document.createElement('img');
    thumb.src = imgEl.src;
    const name = document.createElement('span');
    name.className = 'thumb-name';
    name.textContent = imgEl._name || `image ${i + 1}`;
    const rm = document.createElement('button');
    rm.className = 'thumb-remove';
    rm.textContent = '✕';
    rm.onclick = (e) => { e.preventDefault(); removeImage(i); };
    row.appendChild(thumb);
    row.appendChild(name);
    row.appendChild(rm);
    imgList.appendChild(row);
  });
}

fileInput.addEventListener('change', (e) => {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  let loaded = 0;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const i = new Image();
      i._name = file.name.length > 20 ? file.name.slice(0, 18) + '…' : file.name;
      i.onload = () => {
        images.push(i);
        loaded++;
        if (loaded === files.length) {
          document.getElementById('upload-prompt').style.display = 'none';
          renderThumbs();
          initGrid();
          render();
        }
      };
      i.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
  fileInput.value = '';
});

window.addEventListener('resize', () => { initGrid(); render(); });

initGrid();
render();
</script>
</body>
</html>
